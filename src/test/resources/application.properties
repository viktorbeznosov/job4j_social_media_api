# Отключаем Liquibase для тестов
spring.liquibase.enabled=false

# Используем H2 базу данных для тестов
spring.datasource.url=jdbc:h2:./testdb;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=
spring.datasource.password=

# JPA настройки для автоматического создания схемы
spring.liquibase.change-log=classpath:db/dbchangelog.xml
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true